<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Live Truck Tracking</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F5F7; --card: #FFFFFF; --text: #1A2230; --dim: #6B7280; --border: #E3E6EB;
    --accent: #DB8A2E; --green: #1E8E3E; --red: #C0392B; --blue: #2563EB; --amber: #B26A00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161E; --card: #1A212C; --text: #E8E6E1; --dim: #8A93A3; --border: #2B3442; --accent: #F2A93B; --green: #4CC17A; --red: #E5695D; --blue: #6EA0FF; --amber: #F2B04B; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
  .brand { font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.3px; }
  .brand small { display: block; font-family: Inter, sans-serif; font-weight: 500; font-size: 12px; color: var(--dim); letter-spacing: 0; margin-top: 2px; }
  .live-tag { font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
  .live-tag.on { color: var(--green); }
  .live-tag.on .dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); } 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .truck { font-family: Oswald, sans-serif; font-weight: 700; font-size: 26px; line-height: 1; }
  .chip { font-size: 12px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; color: #fff; background: var(--blue); white-space: nowrap; }
  .chip.at { background: var(--accent); color: #1A1300; }
  .chip.done { background: var(--green); }
  .chip.paused { background: var(--dim); }
  .stops { margin-top: 16px; display: grid; gap: 0; }
  .stop { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; }
  .stop + .stop { border-top: 1px dashed var(--border); }
  .pin { width: 12px; height: 12px; border-radius: 50%; margin: 5px 0 0 4px; border: 2.5px solid var(--dim); }
  .stop.del .pin { border-color: #E53935; background: #E53935; }
  .stop.current .pin { border-color: var(--accent); }
  .kind { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .place { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .city { font-size: 12.5px; color: var(--dim); font-weight: 500; }
  .when { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .when .sub { display: block; font-size: 11.5px; font-weight: 600; color: var(--dim); margin-top: 2px; }
  .when .ok { color: var(--green); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .fact .l { font-size: 11px; font-weight: 600; color: var(--dim); }
  .fact .v { font-size: 15px; font-weight: 700; margin-top: 1px; }
  #map { position: relative; height: 380px; margin-top: 12px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: var(--card); }
  .truck-mk { min-width: 30px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--accent); color: #1A1300; font-family: Oswald, sans-serif; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .flag-mk { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .foot { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.5; }
  .msg { text-align: center; padding: 48px 20px; }
  .msg h1 { font-family: Oswald, sans-serif; font-size: 22px; margin: 0 0 8px; }
  .msg p { color: var(--dim); margin: 0; font-size: 14px; line-height: 1.5; }
  .skeleton { height: 140px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
  @media (max-width: 420px) { #map { height: 320px; } .place { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand">Live tracking<small id="sub">Updates every minute</small></div>
    <span class="live-tag" id="liveTag"></span>
  </header>
  <div id="main"><div class="skeleton"></div></div>
  <div id="map" hidden></div>
  <div class="foot" id="foot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";
  var API = "https://zhxhfajlglhfoqftsvmp.supabase.co/functions/v1/track";
  var token = new URLSearchParams(location.search).get("t") || "";
  var $ = function (id) { return document.getElementById(id); };
  var map = null, truckMk = null, ends = [], fitted = false, data = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function zoned(dateStr, timeStr, tz) {
    var p = String(dateStr).split("-").map(Number), t = String(timeStr || "00:00").split(":").map(Number);
    var wall = Date.UTC(p[0], p[1] - 1, p[2], t[0] || 0, t[1] || 0);
    function off(ms) {
      var m = {};
      new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
        .formatToParts(new Date(ms)).forEach(function (x) { if (x.type !== "literal") m[x.type] = Number(x.value); });
      return Date.UTC(m.year, m.month - 1, m.day, m.hour === 24 ? 0 : m.hour, m.minute, m.second) - ms;
    }
    var ms = wall - off(wall);
    return wall - off(ms);
  }
  function tzAbbr(tz, when) {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "short", hour: "numeric" }).formatToParts(when || new Date());
    var z = p.filter(function (x) { return x.type === "timeZoneName"; })[0];
    return z ? z.value : "";
  }
  function fmtWhen(ms, tz, withDay) {
    var d = new Date(ms);
    var t = d.toLocaleTimeString("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" });
    if (!withDay) return t;
    return d.toLocaleDateString("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric" }) + ", " + t;
  }
  function ago(iso) {
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
  }

  function showMessage(title, text) {
    $("main").innerHTML = '<div class="card msg"><h1>' + esc(title) + "</h1><p>" + esc(text) + "</p></div>";
    $("map").hidden = true;
    $("liveTag").textContent = "";
    $("foot").textContent = "";
  }

  function stopHtml(kind, s, d, isCurrent) {
    var tz = d.tz, when = "", sub = "";
    if (s.date) {
      var ms = zoned(s.date, s.time || "23:59", tz);
      when = s.time ? fmtWhen(ms, tz, true) + " " + tzAbbr(tz, new Date(ms)) : new Date(ms).toLocaleDateString("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric" });
    }
    if (s.departedAt) sub = '<span class="sub ok">Left ' + esc(fmtWhen(new Date(s.departedAt).getTime(), tz)) + "</span>";
    else if (s.arrivedAt) sub = '<span class="sub ok">Arrived ' + esc(fmtWhen(new Date(s.arrivedAt).getTime(), tz)) + "</span>";
    else if (when) sub = '<span class="sub">' + (kind === "pu" ? "Pickup time" : "Delivery time") + "</span>";
    return '<div class="stop ' + kind + (isCurrent ? " current" : "") + '"><span class="pin"></span><div>' +
      '<div class="kind">' + (kind === "pu" ? "Pickup" : "Delivery") + "</div>" +
      '<div class="place">' + esc(s.name || "—") + "</div>" + (s.city ? '<div class="city">' + esc(s.city) + "</div>" : "") +
      '</div><div class="when">' + esc(when) + sub + "</div></div>";
  }

  var LABELS = { to_pickup: ["On the way to pickup", ""], at_pickup: ["At pickup", "at"], to_delivery: ["On the way", ""], at_delivery: ["At delivery", "at"], delivered: ["Delivered", "done"], paused: ["Not moving", "paused"] };

  function render(d) {
    data = d;
    document.title = "Truck " + d.truck + " · Live tracking";
    if (d.company) { $("brand").firstChild.nodeValue = d.company; }
    var lab = LABELS[d.state] || ["Tracking", ""];
    var hasPu = d.pickup && d.pickup.name;
    var html = '<div class="card"><div class="top"><div class="truck">Truck ' + esc(d.truck) + '</div><span class="chip ' + lab[1] + '">' + esc(lab[0]) + "</span></div>";
    html += '<div class="stops">' + (hasPu ? stopHtml("pu", d.pickup, d, d.leg === "pickup") : "") + stopHtml("del", d.delivery, d, d.leg === "delivery") + "</div>";
    var facts = [];
    if (d.milesLeft != null && d.state.indexOf("to_") === 0) facts.push(["Miles left", "~" + d.milesLeft + " mi"]);
    if (d.position) facts.push(["Last position", ago(d.position.at)]);
    if (facts.length) {
      html += '<div class="facts">' + facts.map(function (f) { return '<div class="fact"><div class="l">' + esc(f[0]) + '</div><div class="v">' + esc(f[1]) + "</div></div>"; }).join("") + "</div>";
    }
    html += "</div>";
    $("main").innerHTML = html;
    var tag = $("liveTag");
    if (d.position && d.position.live) { tag.className = "live-tag on"; tag.innerHTML = '<span class="dot"></span>Live GPS'; }
    else if (d.position) { tag.className = "live-tag"; tag.innerHTML = '<span class="dot"></span>GPS ' + esc(ago(d.position.at)); }
    else { tag.className = "live-tag"; tag.textContent = d.state === "delivered" ? "" : "No live GPS right now"; }
    $("foot").textContent = d.state === "delivered"
      ? "This load has been delivered. This tracking link stops working soon."
      : "Shared by " + (d.company || "the carrier") + " for this load only. The page refreshes every minute.";
    drawMap(d);
  }

  function drawMap(d) {
    var pts = [];
    if (d.pickup && d.pickup.lat != null) pts.push(["pu", d.pickup]);
    if (d.delivery && d.delivery.lat != null) pts.push(["del", d.delivery]);
    if (!window.maplibregl || (!pts.length && !d.position)) { $("map").hidden = true; return; }
    $("map").hidden = false;
    if (!map) {
      try {
        map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [-119.5, 38], zoom: 5, attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false, touchPitch: false });
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
        map.on("load", function () {
          map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
          map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#DB8A2E", "line-width": 4, "line-opacity": 0.8 } });
          drawMap(data);
        });
      } catch (e) { $("map").hidden = true; }
      return;
    }
    if (!map.isStyleLoaded() || !map.getSource("route")) return;
    map.getSource("route").setData({ type: "FeatureCollection", features: d.route && d.route.length > 1 ? [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: d.route } }] : [] });
    ends.forEach(function (m) { m.remove(); });
    ends = pts.map(function (p) {
      var el = document.createElement("div");
      el.className = "flag-mk";
      el.style.background = p[0] === "del" ? "#E53935" : "#6B7280";
      el.title = (p[0] === "del" ? "Delivery: " : "Pickup: ") + (p[1].name || "");
      return new maplibregl.Marker({ element: el }).setLngLat([p[1].lon, p[1].lat]).addTo(map);
    });
    if (truckMk) { truckMk.remove(); truckMk = null; }
    if (d.position) {
      var t = document.createElement("div");
      t.className = "truck-mk";
      t.textContent = d.truck;
      truckMk = new maplibregl.Marker({ element: t }).setLngLat([d.position.lon, d.position.lat]).addTo(map);
    }
    if (!fitted) {
      var all = pts.map(function (p) { return [p[1].lon, p[1].lat]; });
      if (d.position) all.push([d.position.lon, d.position.lat]);
      if (d.route) all = all.concat(d.route);
      if (all.length === 1) map.jumpTo({ center: all[0], zoom: 10 });
      else if (all.length > 1) {
        var lons = all.map(function (c) { return c[0]; }), lats = all.map(function (c) { return c[1]; });
        map.fitBounds([[Math.min.apply(null, lons), Math.min.apply(null, lats)], [Math.max.apply(null, lons), Math.max.apply(null, lats)]], { padding: 48, maxZoom: 12, duration: 0 });
      }
      fitted = true;
    }
  }

  function load() {
    if (!token) { showMessage("Link not found", "This tracking link is incomplete. Please ask the carrier to send it again."); return; }
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: token }) })
      .then(function (r) { return r.json().catch(function () { return { state: "error" }; }); })
      .then(function (d) {
        if (d.state === "not_found") return showMessage("Link not found", "This tracking link isn't valid or was turned off by the carrier.");
        if (d.state === "ended") return showMessage("Tracking ended", "This load is finished, so its tracking link no longer shows the truck.");
        if (d.state === "error" || !d.truck) return showMessage("Can't load tracking", "Please try again in a minute.");
        render(d);
        if (d.state === "delivered") clearInterval(timer);
      })
      .catch(function () { if (!data) showMessage("Can't load tracking", "Check your internet connection and try again."); });
  }
  var timer = setInterval(function () { if (!document.hidden) load(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
